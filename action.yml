name: Capture native windows
description: Launch applications and capture their windows on Linux, Windows, and macOS
author: kojix2
branding:
  icon: camera
  color: blue

inputs:
  os:
    description: ubuntu, windows, or macos
    required: true
  app-names:
    description: Whitespace-separated executable paths relative to the workspace (no arguments or spaces in paths)
    required: true
  output-files:
    description: Optional whitespace-separated PNG paths in the same order as app-names
    required: false
    default: ''
  output-pattern:
    description: PNG path pattern used when output-files is omitted; {name} is the executable basename without .exe and {os} is the requested OS
    required: false
    default: '{name}.png'

  window-timeout:
    description: Seconds to wait for each application window (integer from 1 to 300)
    required: false
    default: '15'
  capture-delay:
    description: Seconds to wait after finding a window before capturing it (integer from 0 to 60)
    required: false
    default: '1'

outputs:
  files:
    description: Newline-separated workspace-relative paths of captured PNGs; set only after all captures succeed
    value: ${{ steps.linux.outputs.files || steps.windows.outputs.files || steps.macos.outputs.files }}
  count:
    description: Number of captured PNGs; set only after all captures succeed
    value: ${{ steps.linux.outputs.count || steps.windows.outputs.count || steps.macos.outputs.count }}

runs:
  using: composite
  steps:
    - name: Validate operating system
      shell: bash
      env:
        REQUESTED_OS: ${{ inputs.os }}
      run: |
        case "$RUNNER_OS:$REQUESTED_OS" in
          Linux:ubuntu|Windows:windows|macOS:macos) ;;
          *) echo "Unsupported runner/os combination: $RUNNER_OS/$REQUESTED_OS" >&2; exit 1 ;;
        esac

    - name: Capture on Linux
      id: linux
      if: inputs.os == 'ubuntu'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_NAMES: ${{ inputs.app-names }}
        OUTPUT_FILES: ${{ inputs.output-files }}
        OUTPUT_PATTERN: ${{ inputs.output-pattern }}
        REQUESTED_OS: ${{ inputs.os }}
        WINDOW_TIMEOUT: ${{ inputs.window-timeout }}
        CAPTURE_DELAY: ${{ inputs.capture-delay }}
      run: bash "$ACTION_PATH/scripts/run-unix.sh"

    - name: Capture on Windows
      id: windows
      if: inputs.os == 'windows'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_NAMES: ${{ inputs.app-names }}
        OUTPUT_FILES: ${{ inputs.output-files }}
        OUTPUT_PATTERN: ${{ inputs.output-pattern }}
        REQUESTED_OS: ${{ inputs.os }}
        WINDOW_TIMEOUT: ${{ inputs.window-timeout }}
        CAPTURE_DELAY: ${{ inputs.capture-delay }}
      run: '& "$env:ACTION_PATH/scripts/run-windows.ps1"'

    - name: Capture on macOS
      id: macos
      if: inputs.os == 'macos'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_NAMES: ${{ inputs.app-names }}
        OUTPUT_FILES: ${{ inputs.output-files }}
        OUTPUT_PATTERN: ${{ inputs.output-pattern }}
        REQUESTED_OS: ${{ inputs.os }}
        WINDOW_TIMEOUT: ${{ inputs.window-timeout }}
        CAPTURE_DELAY: ${{ inputs.capture-delay }}
      run: bash "$ACTION_PATH/scripts/run-unix.sh"
