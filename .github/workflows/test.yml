name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
            app: smoke
            app2: smoke2
          - os: windows
            runner: windows-latest
            app: smoke.exe
            app2: smoke2.exe
          - os: macos
            runner: macos-latest
            app: smoke
            app2: smoke2
    steps:
      - uses: actions/checkout@v7
      - name: Run Unix regression tests
        if: matrix.os != 'windows'
        env:
          BASH_BINARY: /bin/bash
        run: python3 -m unittest discover -s tests -v
      - name: Run Windows input and syntax tests
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./tests/test_windows.ps1
      - name: Prepare Linux test window
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev xvfb xauth openbox wmctrl imagemagick
          read -r -a gtk_flags <<< "$(pkg-config --cflags --libs gtk+-3.0)"
          cc tests/fixtures/window.c -o smoke "${gtk_flags[@]}"
          cc tests/fixtures/no-window.c -o no-window
          cp smoke smoke2
      - name: Prepare Windows test window
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $source = Get-Content tests/fixtures/window.cs -Raw
          Add-Type -TypeDefinition $source -OutputAssembly "$PWD\smoke.exe" -OutputType WindowsApplication -ReferencedAssemblies System.Windows.Forms.dll,System.Drawing.dll
          Add-Type -TypeDefinition 'class NoWindow { static void Main() {} }' -OutputAssembly "$PWD\no-window.exe" -OutputType ConsoleApplication
          Copy-Item smoke.exe smoke2.exe
          (Start-Process .\smoke.exe -ArgumentList overlay -PassThru).Id | Set-Content overlay.pid
      - name: Prepare macOS test window
        if: matrix.os == 'macos'
        run: |
          swiftc tests/fixtures/window.swift -o smoke
          cc tests/fixtures/no-window.c -o no-window
          cp smoke smoke2
      - name: Capture multiple windows with multiline inputs
        id: capture
        uses: ./
        with:
          os: ${{ matrix.os }}
          app-names: |
            ${{ matrix.app }}
            ${{ matrix.app2 }}
          output-pattern: screenshots/{name}-{os}.png
      - name: Verify action outputs
        shell: bash
        env:
          FILES: ${{ steps.capture.outputs.files }}
          COUNT: ${{ steps.capture.outputs.count }}
          OS: ${{ matrix.os }}
        run: |
          test "$COUNT" = 2
          expected=$(printf 'screenshots/smoke-%s.png\nscreenshots/smoke2-%s.png' "$OS" "$OS")
          test "$FILES" = "$expected"
      - name: Verify explicit output filename remains supported
        uses: ./
        with:
          os: ${{ matrix.os }}
          app-names: ${{ matrix.app }}
          output-files: screenshots/explicit.png
      - name: Verify PNG dimensions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, struct
          for name in ('smoke-${{ matrix.os }}', 'smoke2-${{ matrix.os }}', 'explicit'):
              data = pathlib.Path(f'screenshots/{name}.png').read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              width, height = struct.unpack('>II', data[16:24])
              assert 300 <= width <= 900 and 200 <= height <= 800, (width, height)
          PY
      - name: Verify Windows capture excludes the overlapping window
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($file in Get-ChildItem screenshots/*.png) {
            $image = [System.Drawing.Bitmap]::new($file.FullName)
            try {
              $pixel = $image.GetPixel([int]($image.Width / 2), [int]($image.Height / 2))
              if ($pixel.R -ne 0 -or $pixel.G -ne 255 -or $pixel.B -ne 0) { throw "Expected green app window, got $pixel" }
            }
            finally { $image.Dispose() }
          }
      - name: Reject an application that creates no window
        id: no_window
        continue-on-error: true
        uses: ./
        with:
          os: ${{ matrix.os }}
          app-names: ${{ matrix.os == 'windows' && 'no-window.exe' || 'no-window' }}
          output-files: no-window.png
          window-timeout: '2'
      - name: Reject empty inputs
        id: empty
        continue-on-error: true
        uses: ./
        with:
          os: ${{ matrix.os }}
          app-names: ''
          output-files: ''
      - name: Reject duplicate output paths
        id: duplicate
        continue-on-error: true
        uses: ./
        with:
          os: ${{ matrix.os }}
          app-names: ${{ matrix.app }} ${{ matrix.app }}
          output-pattern: screenshots/{name}.png
      - name: Reject invalid output destination on Windows
        if: matrix.os == 'windows'
        id: invalid_output
        continue-on-error: true
        uses: ./
        with:
          os: windows
          app-names: smoke.exe
          output-files: screenshots/explicit.png/fail.png
      - name: Verify Windows cleanup after failure
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          CAPTURE_OUTCOME: ${{ steps.invalid_output.outcome }}
        run: |
          if ($env:CAPTURE_OUTCOME -ne 'failure') { throw 'Expected capture failure' }
          $remaining = @(Get-Process smoke -ErrorAction SilentlyContinue | Where-Object Id -ne (Get-Content overlay.pid))
          if ($remaining.Count -ne 0) { throw 'Application was left running after capture' }
      - name: Reject unsupported operating system
        id: unsupported
        continue-on-error: true
        uses: ./
        with:
          os: unsupported
          app-names: ${{ matrix.app }}
          output-files: unexpected.png
      - name: Verify rejected inputs
        shell: bash
        env:
          EMPTY_OUTCOME: ${{ steps.empty.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate.outcome }}
          UNSUPPORTED_OUTCOME: ${{ steps.unsupported.outcome }}
          NO_WINDOW_OUTCOME: ${{ steps.no_window.outcome }}
        run: test "$EMPTY_OUTCOME" = failure && test "$DUPLICATE_OUTCOME" = failure && test "$UNSUPPORTED_OUTCOME" = failure && test "$NO_WINDOW_OUTCOME" = failure
      - name: Stop Windows overlay
        if: always() && matrix.os == 'windows'
        shell: pwsh
        run: |
          if (Test-Path overlay.pid) {
            Stop-Process -Id (Get-Content overlay.pid) -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: screenshots/*.png
          if-no-files-found: error

  publish-screenshots:
    needs: capture
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: screenshots
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshot-*
          path: screenshots
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: screenshots
          folder: screenshots
